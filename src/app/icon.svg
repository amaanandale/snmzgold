<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141C28" />
      <stop offset="70%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#070A0F" />
    </radialGradient>

    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8C6D1F" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="goldLustre" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="20%" stop-color="#F5D77F" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="90%" stop-color="#ECC84A" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>

    <linearGradient id="pillarGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#A67C1E" />
      <stop offset="100%" stop-color="#ECC84A" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#FFF3C4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Solid Deep Obsidian Black Squircle (#0B0F17) with Smooth Rounded Corners -->
  <rect
    x="12"
    y="12"
    width="488"
    height="488"
    rx="108"
    ry="108"
    fill="url(#bgGrad)"
    stroke="url(#borderGold)"
    stroke-width="3"
  />

  <rect
    x="20"
    y="20"
    width="472"
    height="472"
    rx="100"
    ry="100"
    fill="none"
    stroke="#D4AF37"
    stroke-opacity="0.08"
    stroke-width="1.5"
  />

  <!-- SNMZ Geometric Diamond & Bullion Monogram Emblem -->
  <g filter="url(#goldGlow)" transform="translate(0, 4)">
    <path
      d="M 172 108
         L 122 178
         L 172 208
         L 132 238
         L 174 298
         L 196 268
         L 162 232
         L 194 204
         L 154 176
         L 188 128
         Z"
      fill="url(#goldLustre)"
    />

    <path
      d="M 204 108
         L 242 108
         L 242 372
         L 204 316
         Z"
      fill="url(#pillarGold)"
    />

    <path
      d="M 270 108
         L 308 108
         L 308 316
         L 270 372
         Z"
      fill="url(#pillarGold)"
    />

    <path
      d="M 340 108
         L 390 178
         L 340 208
         L 380 238
         L 338 298
         L 316 268
         L 350 232
         L 318 204
         L 358 176
         L 324 128
         Z"
      fill="url(#goldLustre)"
    />

    <path
      d="M 246 122
         L 266 122
         L 266 388
         L 256 404
         L 246 388
         Z"
      fill="#FFF3C4"
    />

    <polygon
      points="184,98 328,98 312,114 200,114"
      fill="url(#sheen)"
      opacity="0.9"
    />
  </g>

  <line
    x1="120"
    y1="452"
    x2="392"
    y2="452"
    stroke="url(#borderGold)"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.4"
  />
  <circle cx="256" cy="452" r="3" fill="#D4AF37" opacity="0.8" />
</svg>
